services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taxrag
      POSTGRES_PASSWORD: taxrag
      POSTGRES_DB: taxrag
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
volumes:
  pgdata:
